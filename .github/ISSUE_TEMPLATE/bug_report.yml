name: Bug Report
description: Report a bug or unexpected behavior in sigfmt
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Before submitting,
        please search existing issues to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Minimal code snippet or steps that trigger the bug.
        Wrap code in a fenced code block.
      value: |
        ```go
        // code here
        ```
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include diagnostic messages or errors).
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Output of `go version`
      placeholder: "go1.24.0 linux/amd64"
    validations:
      required: true

  - type: input
    id: golangci-version
    attributes:
      label: golangci-lint Version
      description: Output of `golangci-lint --version`
      placeholder: "golangci-lint has version 1.64.6 ..."
    validations:
      required: true

  - type: input
    id: sigfmt-version
    attributes:
      label: sigfmt Version
      description: The sigfmt version/tag or commit hash you are using.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: .golangci.yml sigfmt configuration
      description: Your sigfmt linter settings (if relevant).
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant command output or stack traces.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues for duplicates.
          required: true
        - label: I am using a supported Go version (1.24+).
          required: true
