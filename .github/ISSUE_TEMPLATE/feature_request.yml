name: Feature Request
description: Suggest a new feature or improvement for sigfmt
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please search existing issues first
        to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's currently hard or impossible?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or behavior you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've tried.
    validations:
      required: false

  - type: textarea
    id: example
    attributes:
      label: Example
      description: |
        Show the desired input/output or usage.
      value: |
        ```go
        // before
        ```

        ```go
        // after (desired)
        ```
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched existing issues for duplicates.
          required: true
