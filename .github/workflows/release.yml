name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-formula:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout main
        # The formula is regenerated from the RELEASE CHECKSUMS, not from the
        # tag's tree — checkout main so the commit lands on it (checking out
        # the tag leaves detached HEAD and `git push origin main` fails with
        # "src refspec main does not match any").
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Regenerate Formula/sigfmt.rb from release checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/update-brew-formula.py "$VERSION"

      - name: Commit formula update
        run: |
          git config user.name "AI Maintainer"
          git config user.email "actions@github.com"
          git add Formula/sigfmt.rb
          if git diff --cached --quiet; then
            echo "formula unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "brew: update formula to v${GITHUB_REF_NAME#v}"
          git push origin main
