name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false
      - name: Scan for reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        # gitleaks-action@v2 requires a paid GITLEAKS_LICENSE secret; the
        # binary itself is MIT — run it directly.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          # Fail only on HIGH/CRITICAL; moderate findings are reported but
          # do not block — the Go toolchain patch cadence makes blanket
          # blocking too noisy.
          fail-on-severity: high
        # The action needs the repo's Dependency Graph (Settings → Code
        # security) — until the owner enables it the job reports but
        # does not block.
        continue-on-error: true

  scorecard:
    name: OSSF scorecard
    runs-on: ubuntu-latest
    # Public-repo scoreboard: branch-protection, CI hygiene, dependency
    # hygiene. Published to the Security tab; non-blocking.
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_format: sarif
          results_file: scorecard.sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
